[global_tags]

[agent]
  interval = "12s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "12s"
  flush_jitter = "0s"
  precision = ""
  hostname = "reth-builder"
  omit_hostname = false

[[outputs.influxdb]]
  urls = ["http://influxdb:8086"]
  username = "reporter"
  password = "REPLACE_ME"
  database = "telegraf"
  timeout = "5s"

# Read metrics from one or many prometheus clients
[[inputs.prometheus]]
## An array of urls to scrape metrics from.
urls = ["http://reth-builder:9001/metrics"]

[[inputs.socket_listener]]
  service_address = "udp://:8094"
  data_format = "influx"

